name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Locate project directory
        id: locate-dir
        run: |
          echo "=== Workspace file structure ==="
          ls -la
          if [ -f "package.json" ]; then
            echo "app_dir=." >> $GITHUB_OUTPUT
            echo "Found package.json in root."
          else
            APP_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | sed 's|/package.json||' | sed 's|^\./||')
            if [ -n "$APP_PATH" ]; then
              echo "app_dir=$APP_PATH" >> $GITHUB_OUTPUT
              echo "Found package.json in subdirectory: $APP_PATH"
            else
              echo "app_dir=." >> $GITHUB_OUTPUT
              echo "package.json not found, falling back to root."
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ steps.locate-dir.outputs.app_dir }}
        run: npm install

      - name: Build production bundle
        working-directory: ${{ steps.locate-dir.outputs.app_dir }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate-dir.outputs.app_dir }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
